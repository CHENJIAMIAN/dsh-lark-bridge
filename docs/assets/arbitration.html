<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>dsh-lark-bridge 端级仲裁</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
    }
    body {
      font-family: 'Geist', system-ui, sans-serif;
      background: var(--color-paper);
      color: var(--color-ink);
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 2rem;
    }
    .frame { max-width: 760px; width: 100%; }
    .eyebrow {
      font-family: 'Geist Mono', monospace;
      font-size: 0.62rem; font-weight: 500; letter-spacing: 0.18em;
      text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.4rem;
    }
    h1 {
      font-family: 'Instrument Serif', serif;
      font-size: clamp(1.1rem, 1.6vw + 0.6rem, 1.4rem);
      font-weight: 400; letter-spacing: -0.02em; line-height: 1.2;
      margin-bottom: 1.2rem;
    }
    svg { width: 100%; min-width: 620px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">ARBITRATION · dsh-lark-bridge</p>
    <h1>同一条消息，只有一个端回话</h1>

    <svg viewBox="0 0 720 430" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="arb-title arb-desc">
      <title id="arb-title">端级仲裁</title>
      <desc id="arb-desc">飞书消息进来后，云端台账按 deviceId + form + profile 判定哪个端处于活跃状态，只有那个端回话；其余端待命并共享同一份 ~/.dsh 会话库；活跃端掉线时由下一个端接手。</desc>
      <defs>
        <marker id="a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="a-acc" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="a-mute" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#b0b8c8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- 1. 飞书云 → 台账 -->
      <path d="M 148,86 H 296" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#a)"/>
      <rect x="176" y="66" width="92" height="12" rx="2" fill="#f5f5f5"/>
      <text x="222" y="75" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">INBOUND MSG</text>

      <!-- 台账 → 端A（授权，accent 实线）：下 y150 → 左到 x300 → 下落到 web 顶边 196 -->
      <path d="M 372,120 V 150 H 300 V 196" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#a-acc)"/>
      <rect x="376" y="128" width="58" height="12" rx="2" fill="#f5f5f5"/>
      <text x="405" y="137" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ACTIVE</text>

      <!-- 台账 ⊣ 端B（待命，灰虚线）：下 y172 → 右到 x560 → 下落到 desktop 顶边 196 -->
      <path d="M 372,120 V 172 H 560 V 196" fill="none" stroke="#b0b8c8" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#a-mute)"/>
      <rect x="424" y="180" width="62" height="12" rx="2" fill="#f5f5f5"/>
      <text x="455" y="189" fill="#8b93a3" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">STANDBY</text>

      <!-- 两端 → 会话库（各自下折，落到会话库顶边内 30px 处，不穿框） -->
      <path d="M 300,330 V 351 H 390 V 372" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#a)"/>
      <path d="M 560,330 V 351 H 442 V 372" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#a)"/>

      <!-- ===== 节点 ===== -->
      <!-- 飞书云 -->
      <rect x="52" y="58" width="96" height="56" rx="6" fill="rgba(45,49,66,0.03)"/>
      <rect x="52" y="58" width="96" height="56" rx="6" fill="none" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="100" y="82" fill="#2d3142" font-size="11" font-weight="600" text-anchor="middle">飞书云</text>
      <text x="100" y="98" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">message in</text>

      <!-- 云端台账（判断点，用菱形感：强调边框 + 小徽标） -->
      <rect x="296" y="58" width="152" height="62" rx="6" fill="rgba(235,108,54,0.07)"/>
      <rect x="296" y="58" width="152" height="62" rx="6" fill="none" stroke="rgba(235,108,54,0.55)" stroke-width="1.4"/>
      <text x="372" y="80" fill="#2d3142" font-size="11" font-weight="600" text-anchor="middle">云端台账</text>
      <text x="372" y="95" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">deviceId · form · profile</text>
      <text x="372" y="110" fill="#b06b48" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.1em">WHO REPLIES?</text>

      <!-- 端 A（web, ACTIVE） -->
      <rect x="220" y="196" width="160" height="134" rx="6" fill="rgba(235,108,54,0.06)"/>
      <rect x="220" y="196" width="160" height="134" rx="6" fill="none" stroke="rgba(235,108,54,0.50)" stroke-width="1"/>
      <rect x="232" y="206" width="46" height="13" rx="2" fill="#eb6c36"/>
      <text x="255" y="216" fill="#ffffff" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">ACTIVE</text>
      <text x="300" y="240" fill="#2d3142" font-size="11.5" font-weight="600" text-anchor="middle">web 形态</text>
      <text x="300" y="258" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">profile: web</text>
      <text x="300" y="282" fill="#2d3142" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">回话</text>
      <text x="300" y="302" fill="#7a8399" font-size="8" font-family="'Geist', sans-serif" text-anchor="middle">渲染思考 / 审批 / 结果</text>

      <!-- 端 B（desktop, STANDBY） -->
      <rect x="480" y="196" width="160" height="134" rx="6" fill="rgba(45,49,66,0.02)"/>
      <rect x="480" y="196" width="160" height="134" rx="6" fill="none" stroke="rgba(79,93,117,0.30)" stroke-width="1" stroke-dasharray="5,3"/>
      <rect x="492" y="206" width="54" height="13" rx="2" fill="#e4e7ed"/>
      <text x="519" y="216" fill="#8b93a3" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.1em">STANDBY</text>
      <text x="560" y="240" fill="#5a6478" font-size="11.5" font-weight="600" text-anchor="middle">desktop 形态</text>
      <text x="560" y="258" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">profile: desktop</text>
      <text x="560" y="282" fill="#8b93a3" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">静默待命</text>
      <text x="560" y="302" fill="#9aa2b1" font-size="8" font-family="'Geist', sans-serif" text-anchor="middle">不抢答，下一条消息重新裁决</text>

      <!-- 会话库 -->
      <rect x="330" y="372" width="172" height="44" rx="6" fill="rgba(45,49,66,0.05)"/>
      <rect x="330" y="372" width="172" height="44" rx="6" fill="none" stroke="rgba(79,93,117,0.40)" stroke-width="1"/>
      <text x="416" y="392" fill="#2d3142" font-size="10.5" font-weight="600" text-anchor="middle">同一份会话库 ~/.dsh</text>
      <text x="416" y="406" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">sessions · storages</text>

      <!-- 底部注记 -->
      <text x="52" y="418" fill="#7a8399" font-size="8.5" font-family="'Geist', sans-serif" font-style="italic">活跃端掉线超过心跳窗口 → 下一个端在下一条消息时接手，不丢会话。</text>
    </svg>
  </div>
</body>
</html>
