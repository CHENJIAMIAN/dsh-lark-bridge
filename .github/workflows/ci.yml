name: CI

on:
  push:
    # Every branch, not a list of prefixes: a branch whose name does not
    # match a pattern is a branch whose changes are never checked, and the
    # failure mode is invisible - the push looks accepted and the check
    # never runs. The pull_request trigger below covers the branches that
    # matter most, but a push to a branch with no pull request is still a
    # push, and it should be checked where it lands.
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm must exist BEFORE setup-node's `cache: pnpm` resolves the
      # lockfile — action-setup reads the version from packageManager.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Hygiene runs FIRST: a leaked path or credential is the one failure
      # that cannot be fixed by a follow-up commit (it is already public).
      # Deployment-specific terms arrive via a secret so the list itself
      # stays out of the repository.
      - name: Repo hygiene
        env:
          HYGIENE_PATTERNS: ${{ secrets.REPO_HYGIENE_PATTERNS }}
        run: |
          if [ -n "$HYGIENE_PATTERNS" ]; then
            printf '%s\n' "$HYGIENE_PATTERNS" > "$RUNNER_TEMP/leak-patterns"
            node scripts/check-repo-hygiene.mjs . --lib --patterns-file "$RUNNER_TEMP/leak-patterns"
          else
            node scripts/check-repo-hygiene.mjs . --lib
          fi
      - run: node plugin-contract-test.mjs
      # The documentation is part of the release: a promise the code does not
      # keep is a defect, and it has shipped four times — a "no login
      # needed" line that returned 401, a transcript that carried one side
      # of the conversation, a harness floor the code did not support, a
      # test count that was wrong. This step catches the mechanical part of
      # that drift: the two READMEs disagreeing with each other, a command
      # the bridge implements but no README mentions, a badge that no
      # longer matches the tests that run.
      - run: node scripts/check-docs-consistency.mjs
      - run: pnpm typecheck
      - run: node scripts/verify-dsh-contract.mjs
      - run: pnpm test
      # The build output is committed, and the running plugin loads it, so a
      # change under src/ that never reached lib/ ships the old code with a
      # green check. This has happened: the ledger records a fix that was
      # in the source but not in the bundle the process was running.
      # Rebuilding here and asking git for a difference makes that
      # impossible to merge: the step fails when the committed output does
      # not match what the source produces.
      - name: Committed build matches the source
        run: |
          pnpm run build
          if ! git diff --exit-code -- lib; then
            echo "::error title=lib is stale::The committed build output differs from what the source produces. Run 'pnpm run build' and commit the result."
            exit 1
          fi
