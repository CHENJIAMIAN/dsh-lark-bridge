name: Release

# Tags are the release record. Pushing one runs the same gate as CI and then
# publishes — so a tag can never point at a commit that would have failed CI.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  # npm publish --provenance asks GitHub Actions for an OIDC token to attest
  # the provenance of the published tarball. Without this permission npm 11
  # fails with EUSAGE ("Provenance generation in GitHub Actions requires
  # \"write\" access to the \"id-token\" permission"), which would fail the
  # release the moment NPM_TOKEN is configured — and, because the verify step
  # below only runs when the publish step succeeded, the registry check would
  # be skipped and the release would read as green while nothing shipped.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          # The registry is named here rather than left to npm's default,
          # so the publish step cannot go somewhere else if the runner's
          # configuration says otherwise.
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      - name: Repo hygiene
        env:
          HYGIENE_PATTERNS: ${{ secrets.REPO_HYGIENE_PATTERNS }}
        run: |
          if [ -n "$HYGIENE_PATTERNS" ]; then
            printf '%s\n' "$HYGIENE_PATTERNS" > "$RUNNER_TEMP/leak-patterns"
            node scripts/check-repo-hygiene.mjs . --lib --patterns-file "$RUNNER_TEMP/leak-patterns"
          else
            node scripts/check-repo-hygiene.mjs . --lib
          fi

      # The tag must agree with package.json, or the artifact and the release
      # disagree about what shipped and neither is authoritative.
      - name: Tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $pkg" >&2
            exit 1
          fi

      - run: node plugin-contract-test.mjs
      - run: pnpm typecheck
      - run: node scripts/verify-dsh-contract.mjs
      - run: pnpm test
      - run: pnpm run build

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$(awk -v ver="$GITHUB_REF_NAME" '
            $0 ~ "^## \\[" substr(ver,2) "\\]" {capture=1}
            capture && /^## \[/ && $0 !~ "^## \\[" substr(ver,2) "\\]" {exit}
            capture {print}
          ' CHANGELOG.md)"
          if [ -z "$notes" ]; then
            echo "no CHANGELOG.md section for $GITHUB_REF_NAME" >&2
            exit 1
          fi
          printf '%s\n' "$notes" > "$RUNNER_TEMP/notes.md"
          # A release for this tag may already exist. It does whenever the
          # tag is re-pushed — a rewritten history moves the tag, the
          # workflow runs again, and "gh release create" answers "Release
          # .tag_name already exists" and fails the job. The release was
          # made; the run that came for it found it there.
          #
          # So the release is edited instead of created when it is already
          # there, which also keeps the notes in step with the changelog.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release for $GITHUB_REF_NAME already exists — updating its notes"
            gh release edit "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
          fi

      # A tarball on the release page, so there is a way to install the
      # release before the registry carries it. The release had no assets
      # at all, which left the note in the issue thread ("the tarball can
      # be taken from the release") pointing at nothing. The tarball is
      # built from the same tree the tag points at, and it is the package
      # as npm would receive it.
      - name: Attach the package tarball to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"             | tail -1 | tee "$RUNNER_TEMP/tarball-name"
          tarball="$RUNNER_TEMP/$(cat "$RUNNER_TEMP/tarball-name")"
          if [ ! -f "$tarball" ]; then
            echo "::error title=no tarball produced::npm pack did not produce a file, so the release would carry no way to install it."
            exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" "$tarball" --clobber

      # The npm registry is the channel users actually install from: a fix
      # that never reaches the registry fixes nothing for the people who
      # reported the bug. Until this step existed, every tag since v0.7.0
      # produced a GitHub release and nothing else, so `npm latest` stayed on
      # 0.6.1 and every reporter was still running the old, broken code.
      #
      # The token lives in the repository's Actions secrets (NPM_TOKEN). When
      # it is absent the publish step skips, and the VERIFY step below turns
      # the whole job red — because a green release that never reached the
      # registry is the exact failure this was written to end, and a skip
      # that exits 0 would report success for a fix nobody can install.
      - name: Publish to npm
        id: publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::warning title=npm publish skipped::NPM_TOKEN is not set in this repository's Actions secrets. The GitHub release was created, but the npm registry will NOT be updated — add a repository secret named NPM_TOKEN (an npm automation token with publish rights on this package)."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > "$RUNNER_TEMP/.npmrc"
          npm publish --provenance --access public --userconfig "$RUNNER_TEMP/.npmrc"
          echo "published=true" >> "$GITHUB_OUTPUT"
          echo "::notice title=npm published::$GITHUB_REF_NAME is on the registry."

      # The publish step's own exit code is not the question — the question is
      # whether the registry actually carries this version. A publish that
      # reported success but left the registry behind, or a skip that exited
      # 0, both read as "released" to anyone watching the run. So the state
      # is read from the registry itself.
      #
      # Three ways this check used to lie, all found by running it against a
      # live registry:
      #  - an empty version resolved to `latest` and exited 0, so a malformed
      #    tag read as "published";
      #  - an unreachable registry exited 1 with the message "not on npm",
      #    blaming the release for a network problem;
      #  - a 404 (genuinely absent) and a timeout (unknown) were the same
      #    failure, so a transient blip failed the release.
      # Now: the version must be non-empty, the lookup retries with backoff,
      # and a 404 is distinguished from every other error.
      - name: Verify the registry carries this version
        env:
          # A private userconfig, so the step can point npm at a specific
          # registry without touching the runner's global npm config — and so
          # a stale ~/.npmrc on a self-hosted runner cannot answer the check.
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/verify.npmrc
        run: |
          ver="${GITHUB_REF_NAME#v}"
          if [ -z "$ver" ]; then
            echo "::error title=empty version::The tag '${GITHUB_REF_NAME}' carries no version number, so there is nothing to look up on the registry."
            exit 1
          fi
          echo "checking npm for ${ver}"
          found=0
          unknown=0
          for attempt in 1 2 3 4 5; do
            out="$(npm view "@moyu-good/dsh-lark-bridge@${ver}" version 2>&1)" || true
            # Strip the colour codes npm may emit, so the version can be
            # recognised whatever the registry's client decided to print.
            out="$(printf '%s' "$out" | sed -e 's/\x1b\[[0-9;]*[A-Za-z]//g')"
            # E404 is the registry's answer "this version does not exist",
            # and it is checked FIRST: the error text carries the version
            # number ("404 No match found for version 0.9.1"), so a check
            # that looks for a version number in the output matches the
            # error and reports a version as published when the registry
            # just said it is not there.
            if printf '%s' "$out" | grep -qE 'E404|404 Not Found|No match found'; then
              found=0
              unknown=0
              break
            fi
            # A confirmed version is an exit code of zero AND output that is
            # a version number. npm can exit 0 while printing nothing — a
            # proxy that swallows the response, a registry that answers with
            # an empty body — and then the version would be reported as
            # published when nothing was actually confirmed.
            if printf '%s' "$out" | grep -qE '[0-9]+\.[0-9]+\.[0-9]+'; then
              found=1
              break
            fi
            # Anything else — a timeout, a 5xx, a refused connection, a DNS
            # failure — is an unknown, not an absence, and must not be
            # reported as "not published".
            unknown=1
            echo "::warning title=registry lookup failed (attempt ${attempt})::${out}"
            sleep $((attempt * 5))
          done
          if [ "$found" = "1" ]; then
            echo "::notice title=registry verified::${ver} is on npm."
            exit 0
          fi
          # Only the version string; the raw npm output can be hundreds of
          # lines of stack trace when the registry is unreachable, and that
          # noise must not end up in the job log.
          #
          # npm colours its output when it thinks a terminal is attached, so
          # the version can arrive wrapped in an escape sequence. Anchoring
          # the match at the start of the line then fails and the tag is
          # reported as "unknown" — a wrong fact in the very message that
          # tells a reader what is installed. Strip the escapes first, and
          # take the version out of the line rather than requiring it to be
          # the whole line.
          latest="$(npm view @moyu-good/dsh-lark-bridge dist-tags.latest 2>/dev/null \
            | sed -e 's/\x1b\[[0-9;]*[A-Za-z]//g' \
            | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1 || true)"
          [ -n "$latest" ] || latest=unknown
          if [ "$unknown" = "1" ]; then
            echo "::error title=registry unreachable::The registry did not answer after 5 attempts, so whether ${ver} is published is UNKNOWN — this is not evidence that it is missing. Re-run this workflow when the registry is reachable. (Latest tag seen: ${latest})"
            exit 1
          fi
          echo "::error title=not on npm::${ver} is NOT on the registry (latest is ${latest}). Users installing from npm are still getting ${latest} — the fix in this release does not reach them. Add a repository secret named NPM_TOKEN and re-run this workflow."
          exit 1
